# Keep the WLAN radio awake.
#
# With powersave left at its default the WCN3990 firmware keeps the receiver
# asleep between beacons, and the ath10k driver turns the dynamic powersave
# inactivity timeout into a beacon interval whenever mac80211 asks for zero.
# The AP here beacons every 100 ms, so most packets waited for the next
# beacon: ICMP round trip to the gateway measured ~14 ms median while the
# fastest replies were ~3 ms.  Turning powersave off puts the median at
# ~4 ms with a flat spread, at the cost of some idle power.
[connection]
wifi.powersave = 2
