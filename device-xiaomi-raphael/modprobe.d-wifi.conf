# Put cfg80211 in the CN regulatory domain.
#
# The WCN3990 board data reports the APL1_WORLD regpair (0x52) and the EEPROM
# carries country code CN, so this is the country the phone was certified in.
# Do not leave cfg80211 on the world domain (00): every 5 GHz rule there is
# flagged NL80211_RRF_NO_IR, and channels 52-64 and 100-144 additionally
# require DFS, so the driver cannot actively scan the band and association on
# an ordinary 5 GHz access point fails outright.
options cfg80211 ieee80211_regdom=CN
