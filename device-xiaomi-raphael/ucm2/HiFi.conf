# Use case configuration for the Xiaomi Redmi K20 Pro (raphael, SM8150).
#
# The card has five devices: three outputs (speaker on the TFA9874 class-D
# amplifier through the quaternary MI2S, earpiece and headphones through the
# WCD9340) and two inputs (the built-in pair of analog microphones and the
# headset microphone).
#
# Every device gets its own front end so that switching devices never has to
# reprogram a PCM that another device is still holding open:
#
#   MultiMedia1 -> QUAT_MI2S_RX   Speaker
#   MultiMedia2 -> SLIMBUS_0_RX   Earpiece
#   MultiMedia3 -> SLIMBUS_0_RX   Headphones
#   MultiMedia4 -> SLIMBUS_0_TX   Mic and Headset Mic
#
# The two inputs share MultiMedia4 because the hardware forces them onto the
# same SLIM TX port anyway, but they need different channel counts: the pair of
# built-in microphones fills two slots, the headset one.  The AFE takes the
# channel count from the SLIM TX channel map, and that map is filled by the
# AIF1 capture mixers, so the mixers cannot be switched on once in the verb any
# more: a map with both slots enabled while a mono device opens the front end
# makes the port overflow on the empty slot and the DSP closes it, which reads
# back as silence.  Each device therefore enables exactly the slots it fills.
#
# The speaker keeps its own front end but is declared as a mono device.  The
# TFA9874 drives a single speaker from the first slot of the TDM frame, so a
# stereo stream would lose its right channel; a mono device makes the sound
# server fold both channels down on the way in, and nothing is dropped.
#
# The front end to back end connections live in the verb, not in the devices.
# The sound server opens every PCM of a profile to check whether the profile
# works, and it does that without running any EnableSequence; a front end with
# no backend attached cannot be opened at all, so a device that only wires
# itself up in its own EnableSequence would make every profile look broken.
#
# The AIF1 capture mixers and the SLIM RX pair are the exception to that rule,
# and they stay wired up in the verb.  A bare PCM opened during the profile
# probe still has to reach the DSP with a usable channel map: SLIMBUS_0_TX with
# nothing enabled makes it answer with AFE error 9 ("AFE enable for port 0x4001
# failed -22"), and SLIMBUS_0_RX with SLIM RX0/RX1 left at ZERO makes it
# answer "fail to start AFE port 2" / "ASoC error (-22) at
# snd_soc_dai_prepare()".  The first slot is the one both inputs share, and
# AIF1_PB is the front end both outputs share, so enabling them up front costs
# nothing and keeps every profile openable.
#
# The devices remain mutually exclusive where the hardware forces it: the
# earpiece and the headphones share the SLIM RX0/RX1 slots, and the two inputs
# share SLIM TX0.  The wcd934x driver silently ignores a second claimant of the
# same SLIM port ("SLIM_TX0 PORT is busy"), so ConflictingDevice is what makes
# the old device run its DisableSequence before the new one enables itself.
#
# The headphones have the highest playback priority on purpose: the sound
# server moves to a newly available port only when its priority is strictly
# higher than the active one.  JackControl keeps the headphone port unavailable
# while nothing is plugged in, so the speaker still wins by default and the
# headphone port takes over as soon as it appears.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 1"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia4 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		# The capture side of the WCD9340 leaves DEC0 and DEC1 at their
		# reset value, and that value is 1, which is -84 dB on this
		# codec: the microphones produce a perfectly flat zero until the
		# digital volume is raised.  Nothing else in the use case files
		# sets them, so both built-in microphones record silence.
		cset "name='DEC0 Volume' 84"
		cset "name='DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia4 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		# The TFA9874 drives a single speaker from the first slot of
		# the TDM frame, so a stereo stream would lose its right
		# channel.  Declaring the device as mono makes the sound
		# server fold both channels down on the way in.
		PlaybackChannels 1
	}

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0_1 MIX1 INP1' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
	]

	DisableSequence [
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT0_1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_1 MIX1 INP0' RX0"
		cset "name='RX INT2_1 MIX1 INP0' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX HPH Mode' 'Class-H Hi-Fi Low Power'"
		cset "name='COMP1 Switch' 1"
		cset "name='COMP2 Switch' 1"
	]

	DisableSequence [
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='COMP1 Switch' 0"
		cset "name='COMP2 Switch' 0"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},2"
		JackControl "Headphone Jack"
	}

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]
}

SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX1' 1"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='CDC_IF TX1 MUX' DEC1"
		# SLIM TX0 is the left channel: the bottom main microphone
		cset "name='AMIC MUX0' ADC3"
		cset "name='ADC MUX0' AMIC"
		# SLIM TX1 is the right channel: the top auxiliary microphone
		cset "name='AMIC MUX1' ADC1"
		cset "name='ADC MUX1' AMIC"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='AMIC MUX1' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
		CaptureChannels 2
	}

	ConflictingDevice [
		"Headset Mic"
	]
}

SectionDevice."Headset Mic" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='CDC_IF TX0 MUX' DEC0"
		# AMIC2 is the headset microphone, on MIC BIAS2
		cset "name='AMIC MUX0' ADC2"
		cset "name='ADC MUX0' AMIC"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},3"
		CaptureChannels 1
		JackControl "Headset Mic Jack"
	}

	ConflictingDevice [
		"Mic"
	]
}
